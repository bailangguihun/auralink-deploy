name: Package reviewed R25 controller

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-r25-controller-bundle
  cancel-in-progress: false

jobs:
  package:
    name: Build controller installation artifact
    # Match the native PostgreSQL 16 jobs in PR CI.
    runs-on: ubuntu-24.04
    # Run the same full proof suite as PR CI; its 20/30-minute runs timed out
    # with every completed test passing. Allow slower runners and artifact checks.
    # This remains package-only.
    timeout-minutes: 60
    steps:
      - name: Require release branch
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/release

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check PostgreSQL 16 tools before the full test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          for tool in initdb pg_ctl psql pg_dump pg_restore; do
            executable="/usr/lib/postgresql/16/bin/$tool"
            if ! test -x "$executable"; then
              echo "::error::Required PostgreSQL 16 executable is missing: $executable" >&2
              exit 1
            fi
            "$executable" --version
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify complete R25 test suite
        run: python -B -m unittest discover -s r25 -p 'test_*.py' -v

      - uses: actions/checkout@v4
        with:
          repository: bailangguihun/auralink-core-api
          ref: 130493f4b91c3a7cf3dedb43ec1260c01ddac91e
          path: .studio-core-fixture
          persist-credentials: false

      - name: Verify actual V017 migration and lost-reply recovery
        run: python -B scripts/rehearse-studio-migration.py --pg-bin /usr/lib/postgresql/16/bin --core-source .studio-core-fixture --fixture "$RUNNER_TEMP/studio-migration"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-migration-result
          path: ${{ runner.temp }}/studio-migration/RESULT.json
          if-no-files-found: error

      - name: Package and verify fixed controller allowlist
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/package-r25-release.py create \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python scripts/package-r25-release.py verify \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Package and verify optional VMM extension
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/package-vmm-extension.py create \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python scripts/package-vmm-extension.py verify \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Retain controller installation artifact
        uses: actions/upload-artifact@v4
        with:
          name: r25-controller-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/r25-controller/r25-controller.zip
            dist/r25-controller/r25-controller-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Package optional Community lifecycle library without installing
        shell: bash
        run: |
          set -Eeuo pipefail
          for mode in create verify; do
            python scripts/package-community-extension.py "$mode" \
              --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
              --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: community-controller-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/community-controller/
          if-no-files-found: error
          retention-days: 30

      - name: Retain optional VMM extension without installation
        uses: actions/upload-artifact@v4
        with:
          name: r25-vmm-extension-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/r25-vmm-extension/vmm-extension.zip
            dist/r25-vmm-extension/manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: State installation boundary
        run: |
          echo '### NOT_DEPLOYED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified controller bundle retained for future reviewed installation. No server connection, installation, or production switch was performed.' >> "$GITHUB_STEP_SUMMARY"
