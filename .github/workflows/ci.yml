name: Deployment configuration CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, release]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-runtime:
    name: Validate Community process lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s r25 -p 'test_community_runtime.py' -v

  validate:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify R25 publication transaction failures
        run: python -m unittest discover -s r25 -p 'test_*.py' -v

      - name: Verify legacy start is opt-in
        shell: bash
        run: |
          set -Eeuo pipefail
          if bash scripts/start.sh; then
            echo 'Legacy start must refuse without --legacy.' >&2
            exit 1
          else
            code=$?
            test "$code" -eq 64
          fi

      - name: Check shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Validate base and GPU Compose configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose version
          temporary_dir="$(mktemp -d)"
          trap 'rm -f "$temporary_dir/.env"; rmdir "$temporary_dir"' EXIT
          cp .env.example "$temporary_dir/.env"
          default_services="$(docker compose --env-file "$temporary_dir/.env" \
            -f docker-compose.yml -f docker-compose.gpu.yml config --services)"
          test -z "$default_services"
          docker compose --env-file "$temporary_dir/.env" \
            --profile legacy -f docker-compose.yml config --quiet
          docker compose --env-file "$temporary_dir/.env" \
            --profile legacy -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose --env-file "$temporary_dir/.env" --profile legacy \
            -f docker-compose.yml -f docker-compose.gpu.yml config --format json \
            | python -c 'import json,sys; services=json.load(sys.stdin)["services"]; assert services and all(s.get("profiles")==["legacy"] for s in services.values()), "Legacy services must require the legacy profile"'

  release-source:
    name: Verify main-to-release promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require this repository's main branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if [[ "$HEAD_BRANCH" != 'main' || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo 'Release pull requests must come from main in this repository.' >&2
            exit 1
          fi
