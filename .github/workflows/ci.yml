name: Deployment configuration CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, release]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community-host:
    name: Validate Community host and native database boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bailangguihun/auralink-core-api
          ref: ced10c6b6ae5fcb6a7dbbb222e4a1a2648f076a0
          path: .community-core-fixture
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: .community-core-fixture/community-service
      - name: Exercise actual Node package, native PostgreSQL and original guard
        run: |
          test -x /usr/lib/postgresql/16/bin/initdb
          python -B scripts/rehearse-community-host.py \
            --pg-bin /usr/lib/postgresql/16/bin \
            --core-source .community-core-fixture \
            --fixture "$RUNNER_TEMP/community-host-fixture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-host-result
          path: ${{ runner.temp }}/community-host-fixture/RESULT.json
          if-no-files-found: error

  community-runtime:
    name: Validate Community process lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B -m unittest discover -s r25 -p 'test_community_runtime.py' -v

  r25-shards:
    name: R25 suite shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # Independent runners isolate tests that patch global state. Each shard is serial.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify discovery, partitioning and failure reporting
        run: python -B -m unittest discover -s scripts/tests -p 'test_r25_test_shards.py' -v
      - name: Run assigned occurrences from complete R25 discovery
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf 'Source commit: %s\n' "$SOURCE_COMMIT"
          python -B scripts/r25_test_shards.py run \
            --shard '${{ matrix.shard }}' --commit "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/r25-shard-${{ matrix.shard }}/report.json"
      - name: Retain discovery manifest and per-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r25-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/r25-shard-${{ matrix.shard }}/report.json
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate deployment configuration
    needs: [r25-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every matrix shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.r25-shards.result }}
        run: test "$SHARDS_RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: r25-shard-*
          path: ${{ runner.temp }}/r25-shard-reports

      - name: Require four complete reports covering every discovered occurrence
        run: |
          python -B scripts/r25_test_shards.py verify-reports \
            --directory "$RUNNER_TEMP/r25-shard-reports" --commit "$GITHUB_SHA"

      - name: Verify legacy start is opt-in
        shell: bash
        run: |
          set -Eeuo pipefail
          if bash scripts/start.sh; then
            echo 'Legacy start must refuse without --legacy.' >&2
            exit 1
          else
            code=$?
            test "$code" -eq 64
          fi

      - name: Check shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Validate base and GPU Compose configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          docker compose version
          temporary_dir="$(mktemp -d)"
          trap 'rm -f "$temporary_dir/.env"; rmdir "$temporary_dir"' EXIT
          cp .env.example "$temporary_dir/.env"
          default_services="$(docker compose --env-file "$temporary_dir/.env" \
            -f docker-compose.yml -f docker-compose.gpu.yml config --services)"
          test -z "$default_services"
          docker compose --env-file "$temporary_dir/.env" \
            --profile legacy -f docker-compose.yml config --quiet
          docker compose --env-file "$temporary_dir/.env" \
            --profile legacy -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose --env-file "$temporary_dir/.env" --profile legacy \
            -f docker-compose.yml -f docker-compose.gpu.yml config --format json \
            | python -c 'import json,sys; services=json.load(sys.stdin)["services"]; assert services and all(s.get("profiles")==["legacy"] for s in services.values()), "Legacy services must require the legacy profile"'

  release-source:
    name: Verify main-to-release promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require this repository's main branch
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if [[ "$HEAD_BRANCH" != 'main' || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo 'Release pull requests must come from main in this repository.' >&2
            exit 1
          fi
