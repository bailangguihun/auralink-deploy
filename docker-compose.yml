name: auralink

services:
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - core-api
    networks:
      - auralink-network

  core-api:
    image: ${CORE_API_IMAGE}
    restart: unless-stopped
    environment:
      SERVER_PORT: "5000"
      DATABASE_URL: jdbc:sqlite:/data/database/auralink.db
      JWT_SECRET: ${JWT_SECRET}
      VMM_URL: http://vmm-service:5001
      VISION_URL: http://vision-service:5002
      UPLOAD_DIR: /data/uploads
      AUDIO_DIR: /data/audio
      PICTURE_DIR: /data/picture
      PAINTINGS_CSV_PATH: /data/metadata/paintings.csv
      IMAGE_BASE_URL: ${IMAGE_BASE_URL}
    volumes:
      - ${DATABASE_DIR}:/data/database
      - ${UPLOAD_DIR}:/data/uploads
      - ${AUDIO_DIR}:/data/audio
      - ${PICTURE_DIR}:/data/picture:ro
      - ${PAINTINGS_CSV_HOST_PATH}:/data/metadata/paintings.csv:ro
    expose:
      - "5000"
    depends_on:
      - vmm-service
      - vision-service
    networks:
      - auralink-network

  vmm-service:
    image: ${AI_SERVICE_IMAGE}
    command:
      - python
      - /app/vmm-service/app.py
    restart: unless-stopped
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT}
      VMM_MODEL_PATH: ${VMM_MODEL_PATH}
      VMM_CHECKPOINT_PATH: ${VMM_CHECKPOINT_PATH}
      PUBLIC_AUDIO_FOLDER: /data/audio
      VMM_UPLOAD_FOLDER: /data/uploads/vmm
      VMM_DEVICE: ${VMM_DEVICE}
      VMM_HOST: 0.0.0.0
      VMM_PORT: "5001"
    volumes:
      - ${MODEL_DIR}:/data/auralink/models:ro
      - ${AUDIO_DIR}:/data/audio
      - ${UPLOAD_DIR}/vmm:/data/uploads/vmm
    expose:
      - "5001"
    networks:
      - auralink-network

  vision-service:
    image: ${AI_SERVICE_IMAGE}
    command:
      - python
      - /app/vision-service/app.py
    restart: unless-stopped
    environment:
      QWEN_MODEL_PATH: ${QWEN_MODEL_PATH}
      PUBLIC_AUDIO_FOLDER: /data/audio
      VISION_UPLOAD_FOLDER: /data/uploads/vision
      VISION_HOST: 0.0.0.0
      VISION_PORT: "5002"
    volumes:
      - ${MODEL_DIR}:/data/auralink/models:ro
      - ${AUDIO_DIR}:/data/audio
      - ${UPLOAD_DIR}/vision:/data/uploads/vision
    expose:
      - "5002"
    networks:
      - auralink-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - core-api
    networks:
      - auralink-network

networks:
  auralink-network:
    driver: bridge
